<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nathan Hart — IT Professional</title>
  <meta name="description" content="Nathan Hart — IT Professional based in the UK. View projects and CV." />
  <meta name="keywords" content="ServiceNow Administrator, ServiceNow, ITSM, IT Professional, Flow Designer, Platform Analytics, UK" />
  <meta name="author" content="Nathan Hart" />
  <meta property="og:title" content="Nathan Hart — IT Professional" />
  <meta property="og:description" content="IT Professional based in the UK, building toward ServiceNow Administrator certification. View credentials, projects and CV." />
  <meta property="og:url" content="https://nathanhart.uk" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --sn-dark:#0b1120; --sn-teal:#00c8a0; --sn-teal-dim:#00a884;
      --sn-muted:#7a9ab0; --sn-border:rgba(0,200,160,0.18); --sn-card:rgba(14,30,58,0.7);
    }
    html,body{height:100%;}
    body{
      background:var(--sn-dark); color:#e8f0ee; font-family:'Outfit',sans-serif; font-weight:300;
      display:flex; flex-direction:column;
    }

    /* NAV — matches other pages */
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      padding:1.2rem 1.5rem; border-bottom:0.5px solid var(--sn-border);
      max-width:1080px; width:100%; margin:0 auto;
    }
    .nav-logo{ font-family:'DM Serif Display', serif; font-size:1.1rem; color:var(--sn-teal); text-decoration:none; }
    .nav-links{ display:flex; gap:1.5rem; }
    .nav-links a{
      font-size:0.78rem; color:var(--sn-muted); text-decoration:none;
      letter-spacing:0.07em; text-transform:uppercase; transition:color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active{ color:var(--sn-teal); }

    .wrap{
      flex:1; display:grid; grid-template-columns:1fr 1fr; align-items:center;
      max-width:1080px; width:100%; margin:0 auto; padding:2rem 2rem; gap:2rem;
    }

    .left{ max-width:460px; }

    .hero-eyebrow{
      font-family:'DM Mono',monospace; font-size:0.72rem; color:var(--sn-teal);
      letter-spacing:0.14em; text-transform:uppercase; margin-bottom:1rem;
      opacity:0; transform:translateY(10px);
    }
    .hero-name{
      font-family:'DM Serif Display', serif; font-size:3.2rem; line-height:1.1;
      color:#f0f6f4; margin-bottom:2rem;
      opacity:0; transform:translateY(14px);
    }
    .cta-row{ display:flex; gap:0.75rem; opacity:0; transform:translateY(10px); }
    .btn{
      display:inline-flex; align-items:center; gap:8px; padding:11px 24px;
      font-family:'Outfit',sans-serif; font-size:0.85rem; font-weight:500;
      border-radius:6px; text-decoration:none; cursor:pointer;
      transition:background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-primary{ background:var(--sn-teal); color:var(--sn-dark); border:none; }
    .btn-primary:hover{ background:var(--sn-teal-dim); }
    .btn-ghost{ background:transparent; color:var(--sn-teal); border:0.5px solid var(--sn-teal); }
    .btn-ghost:hover{ background:rgba(0,200,160,0.08); }

    .reveal{ animation: fadeRise 0.7s ease forwards; }
    @keyframes fadeRise{ to{ opacity:1; transform:translateY(0); } }

    /* right side: animated hexagon / network graphic */
    .right{ display:flex; align-items:center; justify-content:center; position:relative; }
    .right svg{ width:100%; max-width:420px; height:auto; overflow:visible; }

    .draw{
      fill:none; stroke:var(--sn-teal); stroke-width:1.4;
      stroke-dasharray:1; stroke-dashoffset:1; opacity:0.9;
    }
    .node{ fill:var(--sn-dark); stroke:var(--sn-teal); stroke-width:2.4; opacity:0; }
    .node-fill{ fill:var(--sn-teal); opacity:0; }

    footer{
      padding:1.5rem 0; text-align:center;
      font-family:'DM Mono',monospace; font-size:0.65rem;
      color:var(--sn-muted); letter-spacing:0.07em; text-transform:uppercase;
      border-top:0.5px solid var(--sn-border);
    }

    @media (max-width:820px){
      .wrap{ grid-template-columns:1fr; padding:3rem 1.5rem; text-align:left; }
      .right{ order:-1; margin-bottom:1rem; }
      .right svg{ max-width:260px; }
      .hero-name{ font-size:2.4rem; }
    }

    @media (prefers-reduced-motion: reduce){
      .reveal, .hero-eyebrow, .hero-name, .cta-row{
        opacity:1 !important; transform:none !important; animation:none !important;
      }
      .draw{ stroke-dashoffset:0 !important; }
      .node, .node-fill{ opacity:1 !important; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">Nathan Hart</a>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="projects.html">Projects</a>
      <a href="cv.html">CV</a>
    </div>
  </nav>

  <div class="wrap">
    <div class="left">
      <p class="hero-eyebrow" id="eyebrow">IT Professional</p>
      <h1 class="hero-name" id="heroName">Nathan Hart</h1>
      <div class="cta-row" id="ctaRow">
        <a href="cv.html" class="btn btn-primary">View CV</a>
        <a href="projects.html" class="btn btn-ghost">View Projects</a>
      </div>
    </div>

    <div class="right">
      <svg viewBox="0 0 300 300" id="graphic">
        <polygon class="draw" id="hexOuter" points="150,15 265,80 265,220 150,285 35,220 35,80" />
        <line class="draw" id="lineA" x1="150" y1="70" x2="215" y2="180" />
        <line class="draw" id="lineB" x1="215" y1="180" x2="85" y2="180" />
        <line class="draw" id="lineC" x1="85" y1="180" x2="150" y2="70" />
        <line class="draw" id="lineD" x1="150" y1="70" x2="150" y2="180" />

        <circle class="node" id="nodeTop" cx="150" cy="70" r="7" />
        <circle class="node" id="nodeRight" cx="215" cy="180" r="7" />
        <circle class="node" id="nodeLeft" cx="85" cy="180" r="7" />
        <circle class="node-fill" id="nodeCenter" cx="150" cy="180" r="4" />
      </svg>
    </div>
  </div>

  <footer>nathanhart.uk &nbsp;·&nbsp; IT Professional &nbsp;·&nbsp; UK</footer>

  <script>
    function setPathLength(el){
      const len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
    }
    document.querySelectorAll('.draw').forEach(setPathLength);

    function animateDraw(el, delay, duration){
      setTimeout(() => {
        el.style.transition = `stroke-dashoffset ${duration}ms ease`;
        el.style.strokeDashoffset = 0;
      }, delay);
    }

    animateDraw(document.getElementById('hexOuter'), 150, 750);
    animateDraw(document.getElementById('lineA'), 850, 300);
    animateDraw(document.getElementById('lineB'), 1000, 300);
    animateDraw(document.getElementById('lineC'), 1150, 300);
    animateDraw(document.getElementById('lineD'), 1300, 300);

    ['nodeTop','nodeRight','nodeLeft'].forEach((id, idx) => {
      setTimeout(() => {
        const el = document.getElementById(id);
        el.style.transition = 'opacity 0.3s ease';
        el.style.opacity = 1;
      }, 1500 + idx * 100);
    });
    setTimeout(() => {
      const c = document.getElementById('nodeCenter');
      c.style.transition = 'opacity 0.3s ease';
      c.style.opacity = 1;
    }, 1850);

    setTimeout(() => document.getElementById('eyebrow').classList.add('reveal'), 200);
    setTimeout(() => document.getElementById('heroName').classList.add('reveal'), 380);
    setTimeout(() => document.getElementById('ctaRow').classList.add('reveal'), 560);
  </script>

</body>
</html>
